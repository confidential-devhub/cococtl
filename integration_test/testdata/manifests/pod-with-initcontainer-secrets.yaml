apiVersion: v1
kind: Pod
metadata:
  name: pod-with-initcontainer-secrets
  namespace: default
spec:
  initContainers:
  - name: init-setup
    image: busybox:latest
    command: ["sh", "-c", "echo setup"]
    env:
    - name: INIT_SECRET
      valueFrom:
        secretKeyRef:
          name: my-app-secret
          key: secret-value
  containers:
  - name: app
    image: nginx:latest
